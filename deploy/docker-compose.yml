services:
  postgres:
    image: postgres:16
    container_name: herald-postgres
    environment:
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: herald
      POSTGRES_DB: herald
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    ports:
      - "5432:5432"
    volumes:
      - herald-postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herald"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane-1:
    image: herald-control-plane:latest
    container_name: herald-cp-1
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    environment:
      HERALD_NODE_ID: node-1
      HERALD_PORT: "7700"
      HERALD_DB_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable
      HERALD_GRPC_PORT: "7800"
      HERALD_PEERS: "node-2=control-plane-2:7800,node-3=control-plane-3:7800"
    ports:
      - "7700:7700"
    depends_on:
      postgres:
        condition: service_healthy

  control-plane-2:
    image: herald-control-plane:latest
    container_name: herald-cp-2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    environment:
      HERALD_NODE_ID: node-2
      HERALD_PORT: "7701"
      HERALD_DB_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable
      HERALD_GRPC_PORT: "7800"
      HERALD_PEERS: "node-1=control-plane-1:7800,node-3=control-plane-3:7800"
    ports:
      - "7701:7701"
    depends_on:
      postgres:
        condition: service_healthy

  control-plane-3:
    image: herald-control-plane:latest
    container_name: herald-cp-3
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    environment:
      HERALD_NODE_ID: node-3
      HERALD_PORT: "7702"
      HERALD_DB_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable
      HERALD_GRPC_PORT: "7800"
      HERALD_PEERS: "node-1=control-plane-1:7800,node-2=control-plane-2:7800"
    ports:
      - "7702:7702"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: herald-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: herald-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: herald
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  herald-postgres-data:
