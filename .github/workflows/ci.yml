name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: herald
          POSTGRES_PASSWORD: herald
          POSTGRES_DB: herald
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Build all binaries
        run: go build ./...

      - name: Run tests
        run: go test ./... -v -timeout 120s
        env:
          HERALD_DB_URL: postgres://herald:herald@localhost:5432/herald?sslmode=disable

      - name: Run migration test
        run: go test ./internal/store/... -v -count=1
        env:
          HERALD_DB_URL: postgres://herald:herald@127.0.0.1:5432/herald?sslmode=disable
